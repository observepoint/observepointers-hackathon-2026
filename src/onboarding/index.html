<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObservePointers - Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #2a2a2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      border: 3px solid #ffd700;
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 12px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .question {
      margin-bottom: 24px;
    }

    .question-text {
      color: #333;
      font-weight: 500;
      margin-bottom: 16px;
      font-size: 16px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-item input[type='checkbox'] {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #ffd700;
    }

    .checkbox-item label {
      cursor: pointer;
      color: #333;
      font-size: 15px;
      user-select: none;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: #ffd700;
      color: #000000;
      font-weight: 700;
    }

    .btn-submit:hover {
      background: #ffed4e;
      transform: translateY(-1px);
    }

    .btn-skip {
      background: #000000;
      color: #ffffff;
    }

    .btn-skip:hover {
      background: #333333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to ObservePointers</h1>
    <p class="subtitle">Help us tailor your experience</p>

    <form id="onboarding-form">
      <div class="question">
        <div class="question-text">What are you interested in?</div>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="audits" name="interests" value="audits" />
            <label for="audits">Audits</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="journeys" name="interests" value="journeys" />
            <label for="journeys">Journeys</label>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-skip" id="skip-btn">Skip</button>
        <button type="submit" class="btn-submit">Continue</button>
      </div>
    </form>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
